services:
  - type: web
    name: rent-a-house-api
    env: node
    branch: main
    # Install workspace deps at repo root so shared packages are available
    buildCommand: corepack enable && pnpm -w install
    startCommand: cd apps/api && pnpm start
    healthCheckPath: /health

  - type: web
    name: rent-a-house-web
    env: static
    branch: main
    buildCommand: corepack enable && pnpm -w install && pnpm --filter web run build
    staticPublishPath: apps/web/dist
