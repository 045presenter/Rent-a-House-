services:
  - type: web
    name: rent-a-house-api
    env: node
    branch: main
    root: apps/api
    plan: free
    buildCommand: corepack enable && pnpm -w install
    startCommand: pnpm start
    healthCheckPath: /health

  - type: static
    name: rent-a-house-web
    env: static
    branch: main
    root: apps/web
    plan: free
    buildCommand: corepack enable && pnpm -w install && pnpm --filter web run build
    publishPath: dist
