services:
  - type: web
    name: rent-a-house-api
    env: node
    branch: main
    # Prepare pnpm and install workspace deps during build (not at runtime)
    buildCommand: corepack enable && corepack prepare pnpm@latest --activate && pnpm -w install
    # Start the API with experimental flag for ESM/CommonJS interop
    startCommand: cd apps/api && node --experimental-require-module src/main.js
    healthCheckPath: /health

  - type: web
    name: rent-a-house-web
    env: static
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@latest --activate && pnpm -w install && pnpm --filter web run build
    staticPublishPath: apps/web/dist
